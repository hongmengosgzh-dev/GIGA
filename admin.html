<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar · 运营后台</title><link rel="stylesheet" href="admin.css"><main><header><a href="index.html">NORTHSTAR / HOME</a><span>运营工作台</span></header><h1>连接你的全球货盘。</h1><p>五个市场独立连接。凭证仅在服务器保存。</p><section id="login"><h2>管理员登录</h2><p>部署后，使用你在托管平台设置的管理员访问码。此处不是大健密码。</p><form id="loginForm"><label>管理员访问码<input id="token" type="password" minlength="32" required autocomplete="off"></label><button>登录后台</button></form></section><section id="dashboard" hidden><div class="row"><h2>大健连接</h2><button id="logout" type="button">退出</button></div><p id="state"></p><div id="markets"></div><form id="query"><label>市场<select id="market"><option value="US">美国</option><option value="JP">日本</option><option value="UK">英国</option><option value="DE">德国</option><option value="CA">加拿大</option></select></label><label>读取内容<select id="operation"><option value="catalog">收藏商品（每页 100 条）</option><option value="price">商品采购价</option><option value="inventory">库存</option><option value="status">发货订单状态</option><option value="tracking">包裹物流单号</option></select></label><label>商品页码<input id="page" type="number" min="1" value="1"></label><label>SKU（查询价格或库存时填写，逗号分隔）<textarea id="skus" rows="3"></textarea></label><label>发货订单号（查询状态或物流时填写，逗号分隔）<textarea id="orderNo" rows="3"></textarea></label><button id="read">读取大健数据</button></form><pre id="result"></pre><h2>上线准备</h2><p>收款：尚未连接 · 自动下单：尚未启用 · 定时同步：尚未启用</p><p>这里读取的是供应商原始数据，不会修改前台展示商品，也不会提交采购订单。</p></section><p role="status" id="message"></p><footer>本地文件仅展示界面。真实登录和读取须部署 Pages Functions。<br><a href="接通指南.md">查看接通指南</a></footer></main><script src="admin.js" defer></script></html>
